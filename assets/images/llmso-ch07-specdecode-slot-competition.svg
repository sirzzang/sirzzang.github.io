<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 800" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#c86a5a"/>
</marker>
</defs>
<rect x="0" y="0" width="1450" height="800" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">가중치 읽기 1회의 연산 슬롯 — 저부하와 고부하</text>
<text x="725" y="74" font-size="14.5" text-anchor="middle" fill="#555">한 번의 target forward는 가중치 140GB를 읽는 동안 여러 토큰 위치를 계산할 수 있다. 그 자리(슬롯)를 누가 쓰는가</text>

<!-- ===== Left panel: low load ===== -->
<text x="390" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">동시 요청 1개 (저부하)</text>

<rect x="90" y="150" width="600" height="392" rx="10" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<!-- grid: 6 cols x 6 rows, cell 88x50, gap 8, origin 110,166 -->
<!-- col 1: request + 5 draft candidates -->
<rect x="110" y="456" width="88" height="50" rx="6" fill="#3b5b8f"/>
<text x="154" y="486" font-size="13.5" text-anchor="middle" fill="white">요청 A</text>
<rect x="110" y="398" width="88" height="50" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.5"/>
<text x="154" y="428" font-size="12.5" text-anchor="middle" fill="#1a1a1a">draft 후보1</text>
<rect x="110" y="340" width="88" height="50" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.5"/>
<text x="154" y="370" font-size="12.5" text-anchor="middle" fill="#1a1a1a">draft 후보2</text>
<rect x="110" y="282" width="88" height="50" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.5"/>
<text x="154" y="312" font-size="12.5" text-anchor="middle" fill="#1a1a1a">draft 후보3</text>
<rect x="110" y="224" width="88" height="50" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.5"/>
<text x="154" y="254" font-size="12.5" text-anchor="middle" fill="#1a1a1a">draft 후보4</text>
<rect x="110" y="166" width="88" height="50" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.5"/>
<text x="154" y="196" font-size="12.5" text-anchor="middle" fill="#1a1a1a">draft 후보5</text>
<!-- empty slots cols 2-6 -->
<g fill="white" stroke="#c8c8c8" stroke-width="1.3" stroke-dasharray="5,4">
<rect x="206" y="166" width="88" height="50" rx="6"/><rect x="302" y="166" width="88" height="50" rx="6"/><rect x="398" y="166" width="88" height="50" rx="6"/><rect x="494" y="166" width="88" height="50" rx="6"/><rect x="590" y="166" width="88" height="50" rx="6"/>
<rect x="206" y="224" width="88" height="50" rx="6"/><rect x="302" y="224" width="88" height="50" rx="6"/><rect x="398" y="224" width="88" height="50" rx="6"/><rect x="494" y="224" width="88" height="50" rx="6"/><rect x="590" y="224" width="88" height="50" rx="6"/>
<rect x="206" y="282" width="88" height="50" rx="6"/><rect x="302" y="282" width="88" height="50" rx="6"/><rect x="398" y="282" width="88" height="50" rx="6"/><rect x="494" y="282" width="88" height="50" rx="6"/><rect x="590" y="282" width="88" height="50" rx="6"/>
<rect x="206" y="340" width="88" height="50" rx="6"/><rect x="302" y="340" width="88" height="50" rx="6"/><rect x="398" y="340" width="88" height="50" rx="6"/><rect x="494" y="340" width="88" height="50" rx="6"/><rect x="590" y="340" width="88" height="50" rx="6"/>
<rect x="206" y="398" width="88" height="50" rx="6"/><rect x="302" y="398" width="88" height="50" rx="6"/><rect x="398" y="398" width="88" height="50" rx="6"/><rect x="494" y="398" width="88" height="50" rx="6"/><rect x="590" y="398" width="88" height="50" rx="6"/>
<rect x="206" y="456" width="88" height="50" rx="6"/><rect x="302" y="456" width="88" height="50" rx="6"/><rect x="398" y="456" width="88" height="50" rx="6"/><rect x="494" y="456" width="88" height="50" rx="6"/><rect x="590" y="456" width="88" height="50" rx="6"/>
</g>
<text x="446" y="316" font-size="14" text-anchor="middle" fill="#8a8a8a" font-style="italic">빈 슬롯 = 노는 연산</text>
<text x="390" y="530" font-size="14" text-anchor="middle" fill="#555">target 가중치 140GB 읽기 1회 (one pass)</text>

<text x="390" y="576" font-size="15" text-anchor="middle" fill="#1a1a1a">후보 검증이 빈 슬롯에 실린다 — 추가 시간 거의 0</text>
<rect x="300" y="596" width="180" height="58" rx="10" fill="white" stroke="#3b5b8f" stroke-width="2"/>
<text x="390" y="626" font-size="22" text-anchor="middle" font-weight="bold" fill="#3b5b8f">2.86배</text>
<text x="390" y="645" font-size="12" text-anchor="middle" fill="#555">영상 예제 기준</text>

<!-- ===== Right panel: high load ===== -->
<text x="1060" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">동시 요청 다수 (고부하)</text>

<!-- overflow draft cells above the box -->
<g fill="white" stroke="#c86a5a" stroke-width="1.5">
<rect x="900" y="158" width="88" height="42" rx="6"/><rect x="996" y="158" width="88" height="42" rx="6"/><rect x="1092" y="158" width="88" height="42" rx="6"/>
</g>
<text x="944" y="184" font-size="12" text-anchor="middle" fill="#c86a5a">draft 후보</text>
<text x="1040" y="184" font-size="12" text-anchor="middle" fill="#c86a5a">draft 후보</text>
<text x="1136" y="184" font-size="12" text-anchor="middle" fill="#c86a5a">draft 후보</text>
<line x1="1040" y1="204" x2="1040" y2="238" stroke="#c86a5a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="1252" y="188" font-size="13" text-anchor="start" fill="#c86a5a">실을 빈 슬롯이 없다 —</text>
<text x="1252" y="207" font-size="13" text-anchor="start" fill="#c86a5a">검증이 초과 연산이 된다</text>

<rect x="760" y="244" width="600" height="298" rx="10" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<!-- grid full: 6 cols x 4 rows requests -->
<g fill="#3b5b8f">
<rect x="780" y="260" width="88" height="50" rx="6"/><rect x="876" y="260" width="88" height="50" rx="6"/><rect x="972" y="260" width="88" height="50" rx="6"/><rect x="1068" y="260" width="88" height="50" rx="6"/><rect x="1164" y="260" width="88" height="50" rx="6"/><rect x="1260" y="260" width="88" height="50" rx="6"/>
<rect x="780" y="318" width="88" height="50" rx="6"/><rect x="876" y="318" width="88" height="50" rx="6"/><rect x="972" y="318" width="88" height="50" rx="6"/><rect x="1068" y="318" width="88" height="50" rx="6"/><rect x="1164" y="318" width="88" height="50" rx="6"/><rect x="1260" y="318" width="88" height="50" rx="6"/>
<rect x="780" y="376" width="88" height="50" rx="6"/><rect x="876" y="376" width="88" height="50" rx="6"/><rect x="972" y="376" width="88" height="50" rx="6"/><rect x="1068" y="376" width="88" height="50" rx="6"/><rect x="1164" y="376" width="88" height="50" rx="6"/><rect x="1260" y="376" width="88" height="50" rx="6"/>
<rect x="780" y="434" width="88" height="50" rx="6"/><rect x="876" y="434" width="88" height="50" rx="6"/><rect x="972" y="434" width="88" height="50" rx="6"/><rect x="1068" y="434" width="88" height="50" rx="6"/><rect x="1164" y="434" width="88" height="50" rx="6"/><rect x="1260" y="434" width="88" height="50" rx="6"/>
</g>
<rect x="846" y="326" width="428" height="38" rx="8" fill="#3b5b8f"/>
<text x="1060" y="352" font-size="15" text-anchor="middle" fill="white" font-weight="bold">다른 요청들의 decode 토큰이 슬롯을 채운다</text>
<text x="1060" y="522" font-size="14" text-anchor="middle" fill="#555">target 가중치 140GB 읽기 1회 (one pass)</text>

<text x="1060" y="576" font-size="15" text-anchor="middle" fill="#1a1a1a">같은 슬롯을 배칭과 draft 검증이 경쟁한다 — 이득 급감</text>
<rect x="970" y="596" width="180" height="58" rx="10" fill="white" stroke="#c86a5a" stroke-width="2"/>
<text x="1060" y="626" font-size="22" text-anchor="middle" font-weight="bold" fill="#c86a5a">1.40배</text>
<text x="1060" y="645" font-size="12" text-anchor="middle" fill="#555">영상 예제 기준</text>

<text x="725" y="716" font-size="13.5" text-anchor="middle" fill="#8a8a8a">배칭이 이미 슬롯을 채우고 있으면(compute-bound 전환) draft 후보의 검증은 공짜가 아니라 pass 시간 증가가 된다.</text>
<text x="725" y="738" font-size="13.5" text-anchor="middle" fill="#8a8a8a">수락률이 낮은 draft일수록 이 초과분이 손실로 남는다 — 동시성 16에서 ngram이 vanilla보다 느려지는 기제다</text>
</svg>
