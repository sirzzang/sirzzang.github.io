<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <marker id="arrO" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#a06a3f"/>
    </marker>
    <marker id="arrG" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#999999"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">

    <!-- 시간 축 -->
    <text x="42" y="78" text-anchor="middle" font-size="13" fill="#888">시간</text>
    <line x1="42" y1="90" x2="42" y2="420" stroke="#bbbbbb" stroke-width="1.5" marker-end="url(#arrG)"/>

    <!-- 행 배경 밴드: prefill / decode -->
    <rect x="66" y="91" width="424" height="190" rx="8" fill="#eef4f9"/>
    <rect x="66" y="283" width="424" height="60" rx="8" fill="#fdf3ec"/>
    <rect x="66" y="347" width="424" height="60" rx="8" fill="#fdf3ec"/>

    <!-- 열 라벨 -->
    <g font-size="14" fill="#555555" text-anchor="middle">
      <text x="196" y="80">나는</text>
      <text x="260" y="80">학교에</text>
      <text x="324" y="80">간다</text>
      <text x="388" y="80">t4</text>
      <text x="452" y="80">t5</text>
    </g>

    <!-- 행 라벨 -->
    <g font-size="14" fill="#333333" text-anchor="end">
      <text x="158" y="127">나는</text>
      <text x="158" y="191">학교에</text>
      <text x="158" y="255">간다</text>
      <text x="158" y="319">t4</text>
      <text x="158" y="383">t5</text>
    </g>

    <!-- 셀: prefill 행 (파랑) -->
    <g fill="#5b8db8">
      <rect x="170" y="95" width="52" height="52" rx="6"/>
      <rect x="170" y="159" width="52" height="52" rx="6"/>
      <rect x="234" y="159" width="52" height="52" rx="6"/>
      <rect x="170" y="223" width="52" height="52" rx="6"/>
      <rect x="234" y="223" width="52" height="52" rx="6"/>
      <rect x="298" y="223" width="52" height="52" rx="6"/>
    </g>
    <!-- 셀: decode 행 (주황) -->
    <g fill="#c9895a">
      <rect x="170" y="287" width="52" height="52" rx="6"/>
      <rect x="234" y="287" width="52" height="52" rx="6"/>
      <rect x="298" y="287" width="52" height="52" rx="6"/>
      <rect x="362" y="287" width="52" height="52" rx="6"/>
      <rect x="170" y="351" width="52" height="52" rx="6"/>
      <rect x="234" y="351" width="52" height="52" rx="6"/>
      <rect x="298" y="351" width="52" height="52" rx="6"/>
      <rect x="362" y="351" width="52" height="52" rx="6"/>
      <rect x="426" y="351" width="52" height="52" rx="6"/>
    </g>
    <!-- 셀: 참고 없음 (점) -->
    <g fill="#c8c8c8">
      <circle cx="260" cy="121" r="3.5"/><circle cx="324" cy="121" r="3.5"/><circle cx="388" cy="121" r="3.5"/><circle cx="452" cy="121" r="3.5"/>
      <circle cx="324" cy="185" r="3.5"/><circle cx="388" cy="185" r="3.5"/><circle cx="452" cy="185" r="3.5"/>
      <circle cx="388" cy="249" r="3.5"/><circle cx="452" cy="249" r="3.5"/>
      <circle cx="452" cy="313" r="3.5"/>
    </g>

    <!-- ① prefill 주석 -->
    <polyline points="505,95 515,95 515,275 505,275" fill="none" stroke="#5b8db8" stroke-width="1.5"/>
    <text x="530" y="130" font-size="15" font-weight="bold" fill="#3d6c94">① Prefill — forward 1회</text>
    <text x="530" y="153" font-size="13.5" fill="#555555">세 행(프롬프트 전체)을 한꺼번에 계산</text>
    <text x="530" y="175" font-size="13.5" fill="#555555">마지막 행의 로짓에서 첫 토큰 t4 샘플링</text>

    <!-- t4 추가 화살표 -->
    <line x1="560" y1="192" x2="560" y2="278" stroke="#a06a3f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO)"/>
    <text x="575" y="240" font-size="13" fill="#a06a3f">t4를 새 행으로 추가</text>

    <!-- ② decode 스텝 1 주석 -->
    <polyline points="505,287 515,287 515,339 505,339" fill="none" stroke="#c9895a" stroke-width="1.5"/>
    <text x="530" y="307" font-size="15" font-weight="bold" fill="#a06a3f">② Decode 스텝 1 — forward 1회</text>
    <text x="530" y="329" font-size="13.5" fill="#555555">t4 행 하나만 계산해 t5 샘플링</text>

    <!-- t5 추가 화살표 -->
    <line x1="560" y1="337" x2="560" y2="360" stroke="#a06a3f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO)"/>
    <text x="575" y="352" font-size="13" fill="#a06a3f">t5를 새 행으로 추가</text>

    <!-- ③ decode 스텝 2 주석 -->
    <polyline points="505,351 515,351 515,403 505,403" fill="none" stroke="#c9895a" stroke-width="1.5"/>
    <text x="530" y="373" font-size="15" font-weight="bold" fill="#a06a3f">③ Decode 스텝 2 — forward 1회</text>
    <text x="530" y="395" font-size="13.5" fill="#555555">t5 행 하나만 계산 — EOS까지 같은 반복</text>

    <!-- 범례 -->
    <g font-size="13" fill="#555555">
      <rect x="170" y="455" width="16" height="16" rx="3" fill="#5b8db8"/>
      <text x="194" y="468">prefill의 forward에서 계산</text>
      <rect x="390" y="455" width="16" height="16" rx="3" fill="#c9895a"/>
      <text x="414" y="468">decode 스텝에서 계산</text>
      <circle cx="608" cy="463" r="3.5" fill="#c8c8c8"/>
      <text x="622" y="468">참고 없음 (차단됐거나 아직 없음)</text>
    </g>
  </g>
</svg>
