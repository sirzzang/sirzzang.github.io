<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 680" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
<marker id="arrr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#c86a5a"/>
</marker>
<pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="9" stroke="#c8c8c8" stroke-width="2.5"/>
</pattern>
</defs>
<rect x="0" y="0" width="1450" height="680" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">iteration의 반복 — 거부 후 재시작 (K=3)</text>

<!-- time axis -->
<line x1="100" y1="100" x2="100" y2="560" stroke="#8a8a8a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="100" y="588" font-size="13.5" text-anchor="middle" fill="#8a8a8a">시간</text>

<!-- ===== iteration 1 ===== -->
<text x="140" y="150" font-size="15.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">iteration 1</text>
<!-- rejected draft above -->
<rect x="600" y="96" width="96" height="42" rx="6" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.3"/>
<text x="648" y="122" font-size="12.5" text-anchor="middle" fill="#8a8a8a">draft 3</text>
<text x="712" y="118" font-size="16" text-anchor="start" fill="#c86a5a" font-weight="bold">✕ 거부</text>
<line x1="648" y1="138" x2="648" y2="166" stroke="#c86a5a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrr)"/>
<!-- baseline -->
<rect x="260" y="170" width="150" height="46" rx="6" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.3"/>
<text x="335" y="198" font-size="14" text-anchor="middle" fill="#1a1a1a">프롬프트</text>
<rect x="418" y="170" width="88" height="46" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="462" y="198" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰1</text>
<rect x="512" y="170" width="88" height="46" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="556" y="198" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰2</text>
<rect x="606" y="170" width="88" height="46" rx="6" fill="white" stroke="#c86a5a" stroke-width="1.8"/>
<text x="650" y="192" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰3′</text>
<text x="650" y="208" font-size="10.5" text-anchor="middle" fill="#c86a5a">target 생성</text>
<text x="1120" y="188" font-size="14" text-anchor="start" fill="#555">draft 3개 중 2개 수락, 3번째 거부</text>
<text x="1120" y="208" font-size="14" text-anchor="start" fill="#555">→ 확정 3개 (수락 길이 3)</text>

<line x1="335" y1="224" x2="335" y2="252" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="352" y="244" font-size="12.5" text-anchor="start" fill="#8a8a8a">확정된 시퀀스 위에서 재시작</text>

<!-- ===== iteration 2 ===== -->
<text x="140" y="300" font-size="15.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">iteration 2</text>
<rect x="260" y="320" width="230" height="46" rx="6" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.3"/>
<text x="375" y="348" font-size="14" text-anchor="middle" fill="#1a1a1a">프롬프트 + 토큰 3개</text>
<rect x="498" y="320" width="88" height="46" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="542" y="348" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰4</text>
<rect x="592" y="320" width="88" height="46" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="636" y="348" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰5</text>
<rect x="686" y="320" width="88" height="46" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="730" y="348" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰6</text>
<rect x="780" y="320" width="88" height="46" rx="6" fill="white" stroke="#c86a5a" stroke-width="1.8"/>
<text x="824" y="342" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰7</text>
<text x="824" y="358" font-size="10.5" text-anchor="middle" fill="#c86a5a">보너스</text>
<text x="1120" y="338" font-size="14" text-anchor="start" fill="#555">draft 3개 전부 수락 + 보너스 1개</text>
<text x="1120" y="358" font-size="14" text-anchor="start" fill="#555">→ 확정 4개 (수락 길이 K+1)</text>

<line x1="335" y1="374" x2="335" y2="402" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#arr)"/>

<!-- ===== iteration 3 ===== -->
<text x="140" y="450" font-size="15.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">iteration 3</text>
<!-- rejected drafts above -->
<rect x="560" y="396" width="88" height="42" rx="6" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.3"/>
<text x="604" y="422" font-size="12.5" text-anchor="middle" fill="#8a8a8a">draft 8</text>
<rect x="654" y="396" width="88" height="42" rx="6" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.3"/>
<text x="698" y="422" font-size="12.5" text-anchor="middle" fill="#8a8a8a">draft 9</text>
<rect x="748" y="396" width="88" height="42" rx="6" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.3"/>
<text x="792" y="422" font-size="12.5" text-anchor="middle" fill="#8a8a8a">draft 10</text>
<text x="850" y="418" font-size="16" text-anchor="start" fill="#c86a5a" font-weight="bold">✕ 첫 후보부터 거부 — 나머지는 미평가 폐기</text>
<line x1="604" y1="438" x2="604" y2="466" stroke="#c86a5a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrr)"/>
<!-- baseline -->
<rect x="260" y="470" width="230" height="46" rx="6" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.3"/>
<text x="375" y="498" font-size="14" text-anchor="middle" fill="#1a1a1a">프롬프트 + 토큰 7개</text>
<rect x="560" y="470" width="88" height="46" rx="6" fill="white" stroke="#c86a5a" stroke-width="1.8"/>
<text x="604" y="492" font-size="13.5" text-anchor="middle" fill="#1a1a1a">토큰8′</text>
<text x="604" y="508" font-size="10.5" text-anchor="middle" fill="#c86a5a">target 생성</text>
<text x="1120" y="488" font-size="14" text-anchor="start" fill="#555">전부 거부여도 잔여 분포에서 1개는 확정</text>
<text x="1120" y="508" font-size="14" text-anchor="start" fill="#555">→ 확정 1개 (수락 길이 1)</text>

<!-- summary -->
<rect x="260" y="560" width="900" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="710" y="588" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">target forward 3회로 토큰 8개 확정 (3 + 4 + 1)</text>
<text x="710" y="610" font-size="13.5" text-anchor="middle" fill="#555">일반 decode라면 같은 8개에 target forward 8회 — 수락 길이의 합이 곧 배속의 원천이다</text>
</svg>
