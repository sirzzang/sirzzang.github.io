<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 620" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
<marker id="arrb" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#3b5b8f"/>
</marker>
</defs>
<rect x="0" y="0" width="1450" height="620" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">요청 경로 위의 개입 지점 — 기법과 지표의 대응</text>

<!-- ===== technique boxes (top) ===== -->
<rect x="170" y="110" width="300" height="66" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="200" cy="136" r="14" fill="#1a1a1a"/>
<text x="200" y="141" font-size="14" text-anchor="middle" font-weight="bold" fill="white">4</text>
<text x="226" y="141" font-size="16" text-anchor="start" font-weight="bold" fill="#1a1a1a">고급 KV 캐싱</text>
<text x="192" y="164" font-size="13" text-anchor="start" fill="#555">prefill 재계산 회피 → TTFT ↓</text>
<line x1="320" y1="176" x2="320" y2="272" stroke="#3b5b8f" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrb)"/>

<rect x="560" y="110" width="330" height="66" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="590" cy="136" r="14" fill="#1a1a1a"/>
<text x="590" y="141" font-size="14" text-anchor="middle" font-weight="bold" fill="white">3</text>
<text x="616" y="141" font-size="16" text-anchor="start" font-weight="bold" fill="#1a1a1a">PD Disaggregation</text>
<text x="582" y="164" font-size="13" text-anchor="start" fill="#555">prefill과 decode를 서로 다른 풀에서</text>
<line x1="620" y1="176" x2="360" y2="272" stroke="#3b5b8f" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrb)"/>
<line x1="740" y1="176" x2="690" y2="272" stroke="#3b5b8f" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrb)"/>

<!-- ===== main flow ===== -->
<rect x="70" y="280" width="130" height="56" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="135" y="313" font-size="15.5" text-anchor="middle" fill="#1a1a1a">LLM 요청</text>
<line x1="200" y1="308" x2="236" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="240" y="280" width="150" height="56" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="315" y="313" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">prefill</text>
<line x1="390" y1="308" x2="426" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="430" y="280" width="130" height="56" rx="8" fill="white" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="495" y="313" font-size="15.5" text-anchor="middle" fill="#1a1a1a">첫 토큰</text>
<line x1="560" y1="308" x2="596" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="600" y="280" width="140" height="56" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="670" y="306" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">decode</text>
<text x="670" y="326" font-size="12" text-anchor="middle" fill="#8a8a8a">(토큰 수만큼 반복)</text>
<line x1="740" y1="308" x2="776" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="780" y="280" width="100" height="56" rx="8" fill="white" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="830" y="313" font-size="15" text-anchor="middle" fill="#1a1a1a">토큰</text>
<line x1="880" y1="308" x2="906" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="910" y="280" width="100" height="56" rx="8" fill="white" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="960" y="313" font-size="15" text-anchor="middle" fill="#1a1a1a">토큰</text>
<line x1="1010" y1="308" x2="1036" y2="308" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1040" y="280" width="100" height="56" rx="8" fill="white" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="1090" y="313" font-size="15" text-anchor="middle" fill="#1a1a1a">토큰</text>
<text x="1180" y="315" font-size="18" text-anchor="start" fill="#8a8a8a">…</text>

<!-- ===== metric brackets ===== -->
<path d="M 135 342 C 210 402, 420 402, 495 342" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="315" y="404" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">TTFT — 첫 토큰까지의 시간</text>

<path d="M 830 342 C 860 386, 930 386, 960 342" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5,4"/>
<text x="895" y="400" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">ITL — 토큰 간 지연</text>

<!-- ===== technique box (bottom) ===== -->
<rect x="520" y="452" width="340" height="66" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="550" cy="478" r="14" fill="#1a1a1a"/>
<text x="550" y="483" font-size="14" text-anchor="middle" font-weight="bold" fill="white">1</text>
<text x="576" y="483" font-size="16" text-anchor="start" font-weight="bold" fill="#1a1a1a">Speculative Decoding</text>
<text x="542" y="506" font-size="13" text-anchor="start" fill="#555">스텝당 확정 토큰 ↑ → 토큰당 지연 ↓</text>
<line x1="670" y1="452" x2="670" y2="344" stroke="#3b5b8f" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#arrb)"/>

<text x="725" y="576" font-size="13.5" text-anchor="middle" fill="#8a8a8a">② 분산 실행은 특정 지점이 아니라 경로 전체의 전제다 — 모델이 GPU 한 장을 넘어도 이 경로가 성립하게 만든다</text>
</svg>
