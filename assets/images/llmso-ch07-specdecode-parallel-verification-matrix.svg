<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 780" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
<pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="9" stroke="#d8d8d8" stroke-width="2.5"/>
</pattern>
</defs>
<rect x="0" y="0" width="1450" height="780" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">검증 forward 1회의 내부 — causal mask 위의 병렬 계산 (K=3)</text>

<!-- axis labels -->
<text x="552" y="106" font-size="14" text-anchor="middle" fill="#8a8a8a" font-style="italic">참조하는 입력 (key) — draft가 미리 공급해 이미 존재한다</text>
<text x="180" y="140" font-size="14" text-anchor="start" fill="#8a8a8a" font-style="italic">계산 위치 (query)</text>

<!-- column labels -->
<text x="420" y="140" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">프롬프트</text>
<text x="548" y="140" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">d1</text>
<text x="676" y="140" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">d2</text>
<text x="804" y="140" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">d3</text>

<!-- row 0 -->
<text x="340" y="196" font-size="14" text-anchor="end" fill="#1a1a1a">프롬프트 끝</text>
<rect x="360" y="160" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="488" y="160" width="120" height="64" rx="5" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<rect x="616" y="160" width="120" height="64" rx="5" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<rect x="744" y="160" width="120" height="64" rx="5" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<line x1="872" y1="192" x2="908" y2="192" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="912" y="166" width="240" height="52" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="1032" y="198" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">p(·|프롬프트)</text>
<text x="1170" y="198" font-size="13.5" text-anchor="start" fill="#555">→ d1을 이 분포로 검증</text>

<!-- row 1 -->
<text x="340" y="304" font-size="14" text-anchor="end" fill="#1a1a1a" font-family="Menlo, monospace">d1</text>
<rect x="360" y="268" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="488" y="268" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="616" y="268" width="120" height="64" rx="5" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<rect x="744" y="268" width="120" height="64" rx="5" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<line x1="872" y1="300" x2="908" y2="300" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="912" y="274" width="240" height="52" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="1032" y="306" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">p(·|프롬프트,d1)</text>
<text x="1170" y="306" font-size="13.5" text-anchor="start" fill="#555">→ d2 검증</text>

<!-- row 2 -->
<text x="340" y="412" font-size="14" text-anchor="end" fill="#1a1a1a" font-family="Menlo, monospace">d2</text>
<rect x="360" y="376" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="488" y="376" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="616" y="376" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="744" y="376" width="120" height="64" rx="5" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<line x1="872" y1="408" x2="908" y2="408" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="912" y="382" width="240" height="52" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="1032" y="414" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">p(·|…,d1,d2)</text>
<text x="1170" y="414" font-size="13.5" text-anchor="start" fill="#555">→ d3 검증</text>

<!-- row 3 -->
<text x="340" y="520" font-size="14" text-anchor="end" fill="#1a1a1a" font-family="Menlo, monospace">d3</text>
<rect x="360" y="484" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="488" y="484" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="616" y="484" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<rect x="744" y="484" width="120" height="64" rx="5" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<line x1="872" y1="516" x2="908" y2="516" stroke="#1a1a1a" stroke-width="1.7" marker-end="url(#arr)"/>
<rect x="912" y="490" width="240" height="52" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.6"/>
<text x="1032" y="522" font-size="14.5" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">p(·|…,d2,d3)</text>
<text x="1170" y="514" font-size="13.5" text-anchor="start" fill="#555">→ 전부 수락 시</text>
<text x="1170" y="532" font-size="13.5" text-anchor="start" fill="#555">보너스 토큰 샘플링</text>

<!-- legend -->
<rect x="360" y="580" width="18" height="18" rx="4" fill="#eef3fb" stroke="#3b5b8f" stroke-width="1.4"/>
<text x="388" y="594" font-size="13.5" text-anchor="start" fill="#555">참조 가능 (자기 이전 위치)</text>
<rect x="620" y="580" width="18" height="18" rx="4" fill="url(#hatch)" stroke="#d8d8d8" stroke-width="1.2"/>
<text x="648" y="594" font-size="13.5" text-anchor="start" fill="#555">causal mask (미래 위치 차단)</text>

<!-- summary -->
<rect x="260" y="632" width="930" height="92" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="725" y="666" font-size="15.5" text-anchor="middle" font-weight="bold" fill="#1a1a1a">네 행이 forward 1회에서 동시에 계산된다</text>
<text x="725" y="692" font-size="13.5" text-anchor="middle" fill="#555">각 행의 출력은 자기회귀로 그 지점까지 갔을 때 나왔을 분포와 동일하다.</text>
<text x="725" y="712" font-size="13.5" text-anchor="middle" fill="#555">순차가 필요 없는 이유는 각 행이 참조할 입력 토큰이 draft 덕분에 이미 전부 존재하기 때문이다</text>
</svg>
