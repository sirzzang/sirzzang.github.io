<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 930" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
</defs>
<rect x="0" y="0" width="1450" height="930" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">rejection sampling — 거부가 일어나도 target 분포가 보존된다</text>

<!-- ===== Section 1: two distributions ===== -->
<text x="90" y="96" font-size="16.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">1. 수락 판정 — 같은 위치의 다음 토큰에 대한 두 분포</text>

<!-- legend -->
<rect x="700" y="112" width="16" height="16" fill="#3b5b8f"/>
<text x="724" y="125" font-size="13.5" text-anchor="start" fill="#555">target p(x)</text>
<rect x="820" y="112" width="16" height="16" fill="#b9c9e2"/>
<text x="844" y="125" font-size="13.5" text-anchor="start" fill="#555">draft q(x)</text>

<!-- baseline -->
<line x1="90" y1="400" x2="900" y2="400" stroke="#9a9a9a" stroke-width="1.5"/>

<!-- group: the  p=.40 q=.30 -->
<rect x="114" y="160" width="52" height="240" fill="#3b5b8f"/>
<rect x="174" y="220" width="52" height="180" fill="#b9c9e2"/>
<text x="140" y="150" font-size="13.5" text-anchor="middle" fill="#1a1a1a">0.40</text>
<text x="200" y="210" font-size="13.5" text-anchor="middle" fill="#555">0.30</text>
<text x="170" y="426" font-size="15" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">the</text>

<!-- group: a  p=.25 q=.35 (draft's proposal, highlight) -->
<rect x="262" y="140" width="132" height="292" rx="8" fill="none" stroke="#c86a5a" stroke-width="2" stroke-dasharray="7,5"/>
<rect x="274" y="250" width="52" height="150" fill="#3b5b8f"/>
<rect x="334" y="190" width="52" height="210" fill="#b9c9e2"/>
<text x="300" y="240" font-size="13.5" text-anchor="middle" fill="#1a1a1a">0.25</text>
<text x="360" y="180" font-size="13.5" text-anchor="middle" fill="#555">0.35</text>
<text x="330" y="426" font-size="15" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">a</text>
<text x="330" y="456" font-size="13.5" text-anchor="middle" fill="#c86a5a" font-weight="bold">draft의 제안</text>

<!-- group: cat  p=.20 q=.10 -->
<rect x="434" y="280" width="52" height="120" fill="#3b5b8f"/>
<rect x="494" y="340" width="52" height="60" fill="#b9c9e2"/>
<text x="460" y="270" font-size="13.5" text-anchor="middle" fill="#1a1a1a">0.20</text>
<text x="520" y="330" font-size="13.5" text-anchor="middle" fill="#555">0.10</text>
<text x="490" y="426" font-size="15" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">cat</text>

<!-- group: dog  p=.10 q=.20 -->
<rect x="594" y="340" width="52" height="60" fill="#3b5b8f"/>
<rect x="654" y="280" width="52" height="120" fill="#b9c9e2"/>
<text x="620" y="330" font-size="13.5" text-anchor="middle" fill="#1a1a1a">0.10</text>
<text x="680" y="270" font-size="13.5" text-anchor="middle" fill="#555">0.20</text>
<text x="650" y="426" font-size="15" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">dog</text>

<!-- group: runs  p=.05 q=.05 -->
<rect x="754" y="370" width="52" height="30" fill="#3b5b8f"/>
<rect x="814" y="370" width="52" height="30" fill="#b9c9e2"/>
<text x="780" y="360" font-size="13.5" text-anchor="middle" fill="#1a1a1a">0.05</text>
<text x="840" y="360" font-size="13.5" text-anchor="middle" fill="#555">0.05</text>
<text x="810" y="426" font-size="15" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">runs</text>

<!-- section 1 annotation -->
<rect x="950" y="150" width="440" height="250" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="972" y="186" font-size="15" text-anchor="start" fill="#1a1a1a">draft가 <tspan font-family="Menlo, monospace">a</tspan>를 제안했다 (q = 0.35)</text>
<text x="972" y="216" font-size="15" text-anchor="start" fill="#1a1a1a">target이 매긴 확률은 p = 0.25</text>
<text x="972" y="254" font-size="15" text-anchor="start" fill="#1a1a1a" font-weight="bold">p &lt; q → 확률적 수락:</text>
<text x="972" y="282" font-size="15" text-anchor="start" fill="#1a1a1a" font-family="Menlo, monospace">min(1, p/q) = 0.25/0.35 ≈ 0.71</text>
<text x="972" y="322" font-size="14" text-anchor="start" fill="#555">p ≥ q인 토큰(the·cat·runs)이 제안됐다면</text>
<text x="972" y="344" font-size="14" text-anchor="start" fill="#555">무조건 수락 (min이 1이 된다)</text>
<text x="972" y="378" font-size="14" text-anchor="start" fill="#c86a5a">약 29% 확률로 거부된다 → 아래 2번으로</text>

<!-- ===== Section 2: residual distribution ===== -->
<text x="90" y="530" font-size="16.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">2. 거부 시 — 잔여 분포에서 다시 샘플링</text>

<line x1="90" y1="770" x2="430" y2="770" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="260" y="566" font-size="14" text-anchor="middle" fill="#555">max(0, p − q) : 음수는 0으로 클리핑</text>
<!-- residual bars scale x600: 0.10 -> 60 -->
<rect x="120" y="710" width="40" height="60" fill="#3b5b8f"/>
<text x="140" y="700" font-size="13" text-anchor="middle" fill="#1a1a1a">0.10</text>
<text x="140" y="794" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">the</text>
<rect x="186" y="768" width="40" height="2" fill="#c8c8c8"/>
<text x="206" y="794" font-size="14" text-anchor="middle" fill="#8a8a8a" font-family="Menlo, monospace">a</text>
<rect x="252" y="710" width="40" height="60" fill="#3b5b8f"/>
<text x="272" y="700" font-size="13" text-anchor="middle" fill="#1a1a1a">0.10</text>
<text x="272" y="794" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">cat</text>
<rect x="318" y="768" width="40" height="2" fill="#c8c8c8"/>
<text x="338" y="794" font-size="14" text-anchor="middle" fill="#8a8a8a" font-family="Menlo, monospace">dog</text>
<rect x="384" y="768" width="40" height="2" fill="#c8c8c8"/>
<text x="404" y="794" font-size="14" text-anchor="middle" fill="#8a8a8a" font-family="Menlo, monospace">runs</text>

<line x1="450" y1="690" x2="520" y2="690" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="485" y="668" font-size="13.5" text-anchor="middle" fill="#1a1a1a">÷ 0.20</text>
<text x="485" y="716" font-size="12.5" text-anchor="middle" fill="#8a8a8a">(잔여 합)</text>

<line x1="540" y1="770" x2="880" y2="770" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="710" y="566" font-size="14" text-anchor="middle" fill="#555">재정규화된 잔여 분포 — 여기서 새 토큰을 샘플링</text>
<!-- normalized bars scale x300: 0.5 -> 150 -->
<rect x="570" y="620" width="40" height="150" fill="#3b5b8f"/>
<text x="590" y="610" font-size="13" text-anchor="middle" fill="#1a1a1a">0.50</text>
<text x="590" y="794" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">the</text>
<rect x="636" y="768" width="40" height="2" fill="#c8c8c8"/>
<text x="656" y="794" font-size="14" text-anchor="middle" fill="#8a8a8a" font-family="Menlo, monospace">a</text>
<rect x="702" y="620" width="40" height="150" fill="#3b5b8f"/>
<text x="722" y="610" font-size="13" text-anchor="middle" fill="#1a1a1a">0.50</text>
<text x="722" y="794" font-size="14" text-anchor="middle" fill="#1a1a1a" font-family="Menlo, monospace">cat</text>
<rect x="768" y="768" width="40" height="2" fill="#c8c8c8"/>
<text x="788" y="794" font-size="14" text-anchor="middle" fill="#8a8a8a" font-family="Menlo, monospace">dog</text>
<rect x="834" y="768" width="40" height="2" fill="#c8c8c8"/>
<text x="854" y="794" font-size="14" text-anchor="middle" fill="#8a8a8a" font-family="Menlo, monospace">runs</text>

<!-- ===== Section 3: verification ===== -->
<text x="950" y="530" font-size="16.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">3. 검산 — 두 경로를 합치면</text>
<rect x="950" y="550" width="440" height="260" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="972" y="586" font-size="13.5" text-anchor="start" fill="#555">P(출력) = q·min(1, p/q) + P(거부)·잔여분포</text>
<text x="972" y="622" font-size="14.5" text-anchor="start" fill="#1a1a1a" font-family="Menlo, monospace">the : 0.30·1 + 0.20·0.50 = 0.40</text>
<text x="972" y="652" font-size="14.5" text-anchor="start" fill="#1a1a1a" font-family="Menlo, monospace">a   : 0.35·(0.25/0.35)  = 0.25</text>
<text x="972" y="682" font-size="14.5" text-anchor="start" fill="#1a1a1a" font-family="Menlo, monospace">cat : 0.10·1 + 0.20·0.50 = 0.20</text>
<text x="972" y="712" font-size="14.5" text-anchor="start" fill="#1a1a1a" font-family="Menlo, monospace">dog : 0.20·(0.10/0.20)  = 0.10</text>
<text x="972" y="742" font-size="14.5" text-anchor="start" fill="#1a1a1a" font-family="Menlo, monospace">runs: 0.05·1            = 0.05</text>
<text x="972" y="786" font-size="15" text-anchor="start" fill="#3b5b8f" font-weight="bold">= target 분포 p 그대로 (lossless)</text>

<text x="90" y="880" font-size="13.5" text-anchor="start" fill="#8a8a8a">P(거부) = Σ max(0, q−p) = 0.10(a) + 0.10(dog) = 0.20. 어느 경로로 나와도 출력 토큰의 분포는 target 혼자 생성했을 때와 같다</text>
</svg>
