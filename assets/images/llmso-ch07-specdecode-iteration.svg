<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 660" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
<marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#8a8a8a"/>
</marker>
<pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <line x1="0" y1="0" x2="0" y2="9" stroke="#c8c8c8" stroke-width="2.5"/>
</pattern>
</defs>
<rect x="0" y="0" width="1450" height="660" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">speculative decoding 한 iteration — 추측과 병렬 검증</text>

<!-- ===== step 1 label ===== -->
<text x="640" y="96" font-size="15.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">① draft 모델이 자기회귀로 K개 토큰을 추측 — token speculation (K=4)</text>

<!-- draft row -->
<rect x="60" y="130" width="150" height="76" rx="10" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="135" y="162" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Draft 모델</text>
<text x="135" y="186" font-size="13.5" text-anchor="middle" fill="#555">작고 빠름</text>
<line x1="210" y1="168" x2="256" y2="168" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="260" y="136" width="290" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="405" y="174" font-size="16" text-anchor="middle" fill="#1a1a1a">입력 프롬프트</text>

<rect x="570" y="136" width="150" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="645" y="174" font-size="15.5" text-anchor="middle" fill="#1a1a1a">draft 토큰1</text>
<rect x="740" y="136" width="150" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="815" y="174" font-size="15.5" text-anchor="middle" fill="#1a1a1a">draft 토큰2</text>
<rect x="910" y="136" width="150" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="985" y="174" font-size="15.5" text-anchor="middle" fill="#1a1a1a">draft 토큰3</text>
<rect x="1080" y="136" width="150" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="1155" y="174" font-size="15.5" text-anchor="middle" fill="#1a1a1a">draft 토큰4</text>

<!-- sequential arcs above draft tokens -->
<path d="M 645 132 C 680 108, 780 108, 812 132" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<path d="M 815 132 C 850 108, 950 108, 982 132" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<path d="M 985 132 C 1020 108, 1120 108, 1152 132" fill="none" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<text x="480" y="120" font-size="13" text-anchor="middle" fill="#8a8a8a" font-style="italic">순차 생성 (forward K회, 대신 가볍다)</text>

<!-- ===== vertical verification arrows ===== -->
<line x1="645" y1="200" x2="645" y2="332" stroke="#3b5b8f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<line x1="815" y1="200" x2="815" y2="332" stroke="#3b5b8f" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<line x1="985" y1="200" x2="985" y2="332" stroke="#c86a5a" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
<line x1="1155" y1="200" x2="1155" y2="250" stroke="#c86a5a" stroke-width="1.6" stroke-dasharray="6,4"/>
<rect x="325" y="257" width="650" height="21" fill="white"/>
<text x="330" y="272" font-size="15.5" text-anchor="start" fill="#1a1a1a" font-weight="bold">② target 모델이 한 번의 forward로 병렬 검증 — parallel verification</text>

<!-- reject annotation -->
<text x="1155" y="276" font-size="20" text-anchor="middle" fill="#c86a5a" font-weight="bold">✕</text>
<text x="1155" y="300" font-size="13.5" text-anchor="middle" fill="#c86a5a">③ 토큰3에서 거부 —</text>
<text x="1155" y="318" font-size="13.5" text-anchor="middle" fill="#c86a5a">이후 draft 전부 폐기</text>

<!-- target row -->
<rect x="60" y="336" width="150" height="76" rx="10" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="135" y="368" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Target 모델</text>
<text x="135" y="392" font-size="13.5" text-anchor="middle" fill="#555">크고 정확함</text>
<line x1="210" y1="374" x2="256" y2="374" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="260" y="342" width="290" height="64" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="405" y="380" font-size="16" text-anchor="middle" fill="#1a1a1a">입력 프롬프트</text>

<rect x="570" y="342" width="150" height="64" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="645" y="372" font-size="15.5" text-anchor="middle" fill="#1a1a1a">draft 토큰1</text>
<text x="645" y="394" font-size="14" text-anchor="middle" fill="#3b5b8f" font-weight="bold">수락</text>
<rect x="740" y="342" width="150" height="64" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="815" y="372" font-size="15.5" text-anchor="middle" fill="#1a1a1a">draft 토큰2</text>
<text x="815" y="394" font-size="14" text-anchor="middle" fill="#3b5b8f" font-weight="bold">수락</text>
<rect x="910" y="342" width="150" height="64" rx="8" fill="white" stroke="#c86a5a" stroke-width="2"/>
<text x="985" y="372" font-size="15.5" text-anchor="middle" fill="#1a1a1a">토큰3′</text>
<text x="985" y="394" font-size="13.5" text-anchor="middle" fill="#c86a5a">target이 직접 생성</text>
<rect x="1080" y="342" width="150" height="64" rx="8" fill="url(#hatch)" stroke="#c8c8c8" stroke-width="1.5"/>
<text x="1155" y="380" font-size="14" text-anchor="middle" fill="#8a8a8a">폐기</text>

<!-- step 4 annotation -->
<line x1="985" y1="406" x2="985" y2="452" stroke="#c86a5a" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="985" y="478" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">④ 거부 지점에서 target이 잔여 분포로부터 다음 토큰 1개를 직접 샘플링</text>

<!-- result strip -->
<rect x="260" y="520" width="930" height="72" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="725" y="550" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">이번 iteration의 산출: 토큰 3개 (수락 2 + target 생성 1)</text>
<text x="725" y="576" font-size="14" text-anchor="middle" fill="#555">일반 decode라면 target forward 1회 = 토큰 1개. 여기서는 target forward 1회에 3개가 확정됐다</text>
</svg>
