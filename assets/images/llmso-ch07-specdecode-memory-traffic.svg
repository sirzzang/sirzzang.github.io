<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 640" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
</defs>
<rect x="0" y="0" width="1450" height="640" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">토큰 3개를 만드는 두 경로의 HBM 이동량 — 70B(bf16) target 예제</text>

<!-- ===== Left: ordinary decode ===== -->
<text x="360" y="102" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">일반 decode</text>
<text x="360" y="128" font-size="14" text-anchor="middle" fill="#555">토큰 1개마다 target 가중치 전체를 읽는다</text>

<rect x="130" y="150" width="460" height="86" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="360" y="186" font-size="16" text-anchor="middle" fill="#1a1a1a">target 가중치 140GB 읽기</text>
<text x="360" y="212" font-size="14" text-anchor="middle" fill="#555">forward 1회 → 토큰 1개</text>
<rect x="130" y="248" width="460" height="86" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="360" y="284" font-size="16" text-anchor="middle" fill="#1a1a1a">target 가중치 140GB 읽기</text>
<text x="360" y="310" font-size="14" text-anchor="middle" fill="#555">forward 1회 → 토큰 1개</text>
<rect x="130" y="346" width="460" height="86" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="360" y="382" font-size="16" text-anchor="middle" fill="#1a1a1a">target 가중치 140GB 읽기</text>
<text x="360" y="408" font-size="14" text-anchor="middle" fill="#555">forward 1회 → 토큰 1개</text>

<rect x="130" y="466" width="460" height="64" rx="8" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="360" y="496" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">HBM 이동 총량 ≈ 420GB</text>
<text x="360" y="520" font-size="13.5" text-anchor="middle" fill="#555">140GB × forward 3회</text>

<!-- ===== middle callout ===== -->
<rect x="640" y="256" width="170" height="96" rx="10" fill="white" stroke="#3b5b8f" stroke-width="2"/>
<text x="725" y="296" font-size="26" text-anchor="middle" font-weight="bold" fill="#3b5b8f">≈ 2.9배</text>
<text x="725" y="326" font-size="14" text-anchor="middle" fill="#555">이동량 감소</text>

<!-- ===== Right: speculative ===== -->
<text x="1090" y="102" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">speculative decoding (K=5, 3개 확정된 경우)</text>
<text x="1090" y="128" font-size="14" text-anchor="middle" fill="#555">draft가 가볍게 추측하고, target은 한 번만 읽는다</text>

<rect x="860" y="150" width="460" height="86" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="1090" y="186" font-size="16" text-anchor="middle" fill="#1a1a1a">draft 가중치 1.4GB 읽기 × forward 5회 = 7GB</text>
<text x="1090" y="212" font-size="14" text-anchor="middle" fill="#555">후보 토큰 5개 추측</text>

<line x1="1090" y1="236" x2="1090" y2="266" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<rect x="860" y="270" width="460" height="86" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="1090" y="306" font-size="16" text-anchor="middle" fill="#1a1a1a">target 가중치 140GB 읽기</text>
<text x="1090" y="332" font-size="14" text-anchor="middle" fill="#555">forward 1회 → 후보 5개 병렬 검증, 3개 확정</text>

<rect x="860" y="466" width="460" height="64" rx="8" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="1090" y="496" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">HBM 이동 총량 ≈ 147GB</text>
<text x="1090" y="520" font-size="13.5" text-anchor="middle" fill="#555">140GB × 1회 + 1.4GB × 5회</text>

<text x="725" y="596" font-size="13.5" text-anchor="middle" fill="#8a8a8a">이 산수의 전제는 후보가 수락된다는 것이다. 거부가 잦으면 draft 읽기와 검증 연산이 낭비로 남는다 — 수락률이 이 기법의 전부인 이유</text>
</svg>
