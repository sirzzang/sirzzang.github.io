<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 1070" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
<marker id="arrg" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#8a8a8a"/>
</marker>
</defs>
<rect x="0" y="0" width="1450" height="1070" fill="white"/>
<text x="725" y="46" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">7장 네 기법의 서빙 스택 내 위치</text>

<!-- ===== L0: Application / API ===== -->
<rect x="120" y="78" width="920" height="54" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="580" y="111" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Application / API <tspan font-weight="normal" fill="#555" font-size="14">— 요청 유입</tspan></text>

<line x1="580" y1="132" x2="580" y2="158" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L1: Routing ===== -->
<rect x="120" y="162" width="920" height="88" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="580" y="196" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Routing / Orchestration — Dynamo, llm-d</text>
<text x="580" y="226" font-size="14.5" text-anchor="middle" fill="#555">요청을 어느 인스턴스로 보낼까 — 판단 신호: KV locality(④와 연동) · 큐 깊이(Queue) · SLO</text>
<text x="1070" y="200" font-size="14" text-anchor="start" fill="#555" font-style="italic">④의 캐시 위치 정보를 신호로 쓴다</text>
<text x="1070" y="220" font-size="14" text-anchor="start" fill="#555" font-style="italic">(cache-aware routing)</text>

<line x1="580" y1="250" x2="580" y2="276" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L2: PD Disaggregation ===== -->
<rect x="120" y="280" width="920" height="112" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="150" cy="310" r="15" fill="#1a1a1a"/>
<text x="150" y="316" font-size="15" text-anchor="middle" font-weight="bold" fill="white">3</text>
<text x="180" y="316" font-size="18" text-anchor="start" font-weight="bold" fill="#1a1a1a">PD Disaggregation — prefill과 decode를 물리적으로 분리</text>
<rect x="180" y="332" width="330" height="44" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.3"/>
<text x="345" y="359" font-size="15" text-anchor="middle" fill="#1a1a1a">prefill 풀 (compute-bound)</text>
<rect x="600" y="332" width="330" height="44" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.3"/>
<text x="765" y="359" font-size="15" text-anchor="middle" fill="#1a1a1a">decode 풀 (memory-bound)</text>
<line x1="510" y1="354" x2="596" y2="354" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<text x="553" y="344" font-size="12.5" text-anchor="middle" fill="#8a8a8a">KV 전송</text>
<text x="1070" y="330" font-size="14" text-anchor="start" fill="#555" font-style="italic">TTFT와 ITL을 독립적으로 튜닝</text>
<text x="1070" y="350" font-size="14" text-anchor="start" fill="#555" font-style="italic">비용: KV cache 전송 대역폭</text>

<line x1="580" y1="392" x2="580" y2="418" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L3: Engine + Spec Decoding ===== -->
<rect x="120" y="422" width="920" height="132" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="580" y="454" font-size="18" text-anchor="middle" font-weight="bold" fill="#1a1a1a">LLM Execution Engine — vLLM, SGLang, TensorRT-LLM</text>
<rect x="230" y="472" width="700" height="60" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="262" cy="502" r="15" fill="#1a1a1a"/>
<text x="262" y="508" font-size="15" text-anchor="middle" font-weight="bold" fill="white">1</text>
<text x="292" y="496" font-size="16.5" text-anchor="start" font-weight="bold" fill="#1a1a1a">Speculative Decoding</text>
<text x="292" y="520" font-size="14" text-anchor="start" fill="#555">decode 한 스텝에 여러 토큰 — 엔진 안의 디코딩 로직 교체</text>
<text x="1070" y="484" font-size="14" text-anchor="start" fill="#555" font-style="italic">ITL 개선 — 이득은 저배치에서 최대</text>
<text x="1070" y="504" font-size="14" text-anchor="start" fill="#555" font-style="italic">비용: 거부된 draft 토큰의 연산</text>

<line x1="580" y1="554" x2="580" y2="580" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L4: Distributed Execution ===== -->
<rect x="120" y="584" width="920" height="94" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="150" cy="614" r="15" fill="#1a1a1a"/>
<text x="150" y="620" font-size="15" text-anchor="middle" font-weight="bold" fill="white">2</text>
<text x="180" y="620" font-size="18" text-anchor="start" font-weight="bold" fill="#1a1a1a">Distributed Execution — 모델을 여러 GPU·노드에 분할</text>
<text x="180" y="654" font-size="15" text-anchor="start" fill="#555">DP (복제) · TP (레이어 내 분할) · PP (레이어 간 분할) · EP (expert 분할)</text>
<text x="1070" y="624" font-size="14" text-anchor="start" fill="#555" font-style="italic">메모리 용량·처리량 확장</text>
<text x="1070" y="644" font-size="14" text-anchor="start" fill="#555" font-style="italic">비용: all-reduce 등 집합 통신</text>

<line x1="580" y1="678" x2="580" y2="704" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L5: KV Cache Hierarchy ===== -->
<rect x="120" y="708" width="920" height="112" rx="8" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<circle cx="150" cy="738" r="15" fill="#1a1a1a"/>
<text x="150" y="744" font-size="15" text-anchor="middle" font-weight="bold" fill="white">4</text>
<text x="180" y="744" font-size="18" text-anchor="start" font-weight="bold" fill="#1a1a1a">Advanced KV Caching — KV cache를 계층 저장소로</text>
<rect x="180" y="762" width="170" height="42" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.3"/>
<text x="265" y="788" font-size="14.5" text-anchor="middle" fill="#1a1a1a">GPU HBM</text>
<rect x="390" y="762" width="170" height="42" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.3"/>
<text x="475" y="788" font-size="14.5" text-anchor="middle" fill="#1a1a1a">CPU RAM</text>
<rect x="600" y="762" width="170" height="42" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.3"/>
<text x="685" y="788" font-size="14.5" text-anchor="middle" fill="#1a1a1a">로컬 SSD</text>
<rect x="810" y="762" width="170" height="42" rx="6" fill="white" stroke="#3b5b8f" stroke-width="1.3"/>
<text x="895" y="788" font-size="14.5" text-anchor="middle" fill="#1a1a1a">원격 스토리지</text>
<line x1="350" y1="783" x2="386" y2="783" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<line x1="560" y1="783" x2="596" y2="783" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<line x1="770" y1="783" x2="806" y2="783" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrg)"/>
<text x="1070" y="758" font-size="14" text-anchor="start" fill="#555" font-style="italic">TTFT 단축·캐시 적중률 향상</text>
<text x="1070" y="778" font-size="14" text-anchor="start" fill="#555" font-style="italic">비용: 계층 간 이동, 콜드 스타트</text>

<line x1="580" y1="820" x2="580" y2="846" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L6: Kernels ===== -->
<rect x="120" y="850" width="920" height="54" rx="8" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="580" y="883" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">CUDA / Triton 커널 <tspan font-weight="normal" fill="#555" font-size="14">— 위 계층들이 GPU에 내리는 실행 단위</tspan></text>

<line x1="580" y1="904" x2="580" y2="930" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- ===== L7: Hardware ===== -->
<rect x="120" y="934" width="920" height="60" rx="8" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="580" y="960" font-size="16" text-anchor="middle" font-weight="bold" fill="#1a1a1a">GPU · 인터커넥트 하드웨어</text>
<text x="580" y="982" font-size="13.5" text-anchor="middle" fill="#555">HBM, NVLink/NVSwitch, InfiniBand/RoCE</text>

<!-- legend -->
<rect x="120" y="1016" width="18" height="18" rx="4" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="148" y="1030" font-size="14" text-anchor="start" fill="#555">7장에서 다루는 네 기법 (번호는 책의 소개 순서)</text>
</svg>
