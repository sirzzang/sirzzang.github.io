<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380">
  <defs>
    <marker id="arrB" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#3d6c94"/>
    </marker>
  </defs>
  <rect width="820" height="380" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">

    <!-- 열 라벨 -->
    <g font-size="14" fill="#555555" text-anchor="middle">
      <text x="178" y="58">나는</text>
      <text x="246" y="58">학교에</text>
      <text x="314" y="58">간다</text>
    </g>

    <!-- 행 라벨 -->
    <g font-size="14" fill="#333333" text-anchor="end">
      <text x="138" y="104">나는</text>
      <text x="138" y="172">학교에</text>
      <text x="138" y="240">간다</text>
    </g>

    <!-- 하삼각: 참고 (가중치 유지) -->
    <g fill="#5b8db8">
      <rect x="150" y="70" width="56" height="56" rx="6"/>
      <rect x="150" y="138" width="56" height="56" rx="6"/>
      <rect x="218" y="138" width="56" height="56" rx="6"/>
      <rect x="150" y="206" width="56" height="56" rx="6"/>
      <rect x="218" y="206" width="56" height="56" rx="6"/>
      <rect x="286" y="206" width="56" height="56" rx="6"/>
    </g>

    <!-- 상삼각: 계산되지만 마스크로 차단 -->
    <g>
      <rect x="218" y="70" width="56" height="56" rx="6" fill="#dce9f4" stroke="#b7cbdd"/>
      <rect x="286" y="70" width="56" height="56" rx="6" fill="#dce9f4" stroke="#b7cbdd"/>
      <rect x="286" y="138" width="56" height="56" rx="6" fill="#dce9f4" stroke="#b7cbdd"/>
      <g font-size="14" fill="#8aa4bb" text-anchor="middle">
        <text x="246" y="103">−∞</text>
        <text x="314" y="103">−∞</text>
        <text x="314" y="171">−∞</text>
      </g>
    </g>

    <!-- 주석 -->
    <text x="400" y="96" font-size="15" font-weight="bold" fill="#3d6c94">Prefill — forward 1회</text>
    <text x="400" y="122" font-size="13.5" fill="#555555">세 행(프롬프트 전체)을 한 번의 행렬 곱으로 동시에 계산</text>
    <text x="400" y="148" font-size="13.5" fill="#555555">상삼각 칸도 물리적으로 계산되지만,</text>
    <text x="400" y="168" font-size="13.5" fill="#555555">causal mask(−∞)가 softmax 후 가중치를 0으로 만든다</text>

    <line x1="348" y1="234" x2="392" y2="234" stroke="#3d6c94" stroke-width="1.5" marker-end="url(#arrB)"/>
    <text x="400" y="238" font-size="13.5" fill="#3d6c94">마지막 행의 로짓 → 첫 토큰 t4 샘플링</text>

    <!-- 범례 -->
    <g font-size="13" fill="#555555">
      <rect x="150" y="316" width="16" height="16" rx="3" fill="#5b8db8"/>
      <text x="174" y="329">참고 — 가중치 유지</text>
      <rect x="380" y="316" width="16" height="16" rx="3" fill="#dce9f4" stroke="#b7cbdd"/>
      <text x="404" y="329">계산 후 차단 — softmax 뒤 가중치 0</text>
    </g>
  </g>
</svg>
