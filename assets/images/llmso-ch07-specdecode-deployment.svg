<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 640" font-family="Helvetica Neue, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
  <path d="M0,0 L9,4 L0,8 z" fill="#1a1a1a"/>
</marker>
</defs>
<rect x="0" y="0" width="1450" height="640" fill="white"/>
<text x="725" y="44" font-size="24" text-anchor="middle" font-weight="bold" fill="#1a1a1a">두 모델의 적재 구조 — 한 엔진, 한 GPU</text>

<!-- client -->
<rect x="70" y="112" width="170" height="56" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="155" y="146" font-size="15.5" text-anchor="middle" fill="#1a1a1a">클라이언트</text>
<line x1="240" y1="140" x2="306" y2="140" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="273" y="128" font-size="12" text-anchor="middle" fill="#8a8a8a">API 요청</text>

<!-- engine process -->
<rect x="310" y="94" width="830" height="96" rx="8" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1.5"/>
<text x="725" y="128" font-size="17" text-anchor="middle" font-weight="bold" fill="#1a1a1a">서빙 엔진 프로세스 (vLLM 등) — 단일 서버, 단일 엔드포인트</text>
<text x="725" y="156" font-size="14" text-anchor="middle" fill="#555">iteration마다 draft 실행 → target 검증 → 수락/거부. 두 모델 모두 이 엔진 하나가 구동한다</text>

<line x1="725" y1="190" x2="725" y2="222" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>

<!-- GPU box -->
<rect x="310" y="226" width="830" height="204" rx="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
<text x="330" y="258" font-size="16" text-anchor="start" font-weight="bold" fill="#1a1a1a">GPU 1장 — 디바이스 메모리 (예시: 96GB GDDR7)</text>

<rect x="330" y="286" width="440" height="100" rx="6" fill="#3b5b8f"/>
<text x="550" y="328" font-size="15.5" text-anchor="middle" fill="white" font-weight="bold">target 가중치</text>
<text x="550" y="352" font-size="13" text-anchor="middle" fill="#dce6f5">예: Qwen3-32B bf16 ≈ 62GiB</text>

<rect x="782" y="286" width="86" height="100" rx="6" fill="#eef3fb" stroke="#3b5b8f" stroke-width="2"/>
<text x="825" y="328" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">draft</text>
<text x="825" y="350" font-size="12" text-anchor="middle" fill="#555">≈ 2.9GiB</text>

<rect x="880" y="286" width="170" height="100" rx="6" fill="#e9e9e9" stroke="#9a9a9a" stroke-width="1.3"/>
<text x="965" y="328" font-size="14.5" text-anchor="middle" fill="#1a1a1a">KV cache</text>
<text x="965" y="350" font-size="12.5" text-anchor="middle" fill="#555">예: ≈ 17GiB</text>

<rect x="1062" y="286" width="58" height="100" rx="6" fill="white" stroke="#c8c8c8" stroke-width="1.3" stroke-dasharray="5,4"/>
<text x="1091" y="333" font-size="12" text-anchor="middle" fill="#8a8a8a">여유</text>

<text x="330" y="414" font-size="13" text-anchor="start" fill="#8a8a8a">블록 폭은 실제 비율이 아니다. 예시 수치는 7.2.2편 실습 구성(RTX PRO 6000 Blackwell 96GB + Qwen3-32B + eagle3 drafter)</text>

<!-- notes -->
<text x="310" y="478" font-size="14.5" text-anchor="start" fill="#1a1a1a">· draft는 별도 서버가 아니다 — target과 같은 엔진 프로세스, 같은 GPU에 로드된다 (vLLM은 서버 기동 옵션으로 지정)</text>
<text x="310" y="506" font-size="14.5" text-anchor="start" fill="#1a1a1a">· draft 가중치가 차지한 만큼 같은 GPU의 KV cache 예산이 줄어든다</text>
<text x="310" y="534" font-size="14.5" text-anchor="start" fill="#1a1a1a">· n-gram이면 draft 블록 자체가 없고(CPU 테이블 탐색), 셀프 드래프팅이면 draft가 target 내부 모듈로 흡수된다</text>
</svg>
