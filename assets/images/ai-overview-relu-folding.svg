<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="선형변환(늘리기)과 ReLU(접기)의 반복이 직선 경계를 휘어진 경계로 만드는 과정">
  <style>
    .bg { fill: #f7f5f0; }
    .panel { fill: #ffffff; stroke: #d8d3c8; stroke-width: 1.5; }
    .title { fill: #2b2b2b; font-weight: 700; }
    .label { fill: #4a463d; }
    .sub { fill: #7a746a; }
    .axis { stroke: #b8b2a6; stroke-width: 1.5; }
    .blue { fill: #3f6fb0; }
    .pink { fill: #cf5f86; }
    .fail { stroke: #d9534f; stroke-width: 3; fill: none; stroke-dasharray: 7 5; }
    .ok { stroke: #2e7d5b; stroke-width: 3; fill: none; }
    .fold { stroke: #b06a2c; stroke-width: 3; fill: none; }
    .arrow { stroke: #7a746a; stroke-width: 2; fill: none; }
    .markok { fill: #2e7d5b; font-weight: 700; }
    .markfail { fill: #d9534f; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #23262b; }
      .panel { fill: #2c3037; stroke: #3d424a; }
      .title { fill: #e8e6e1; }
      .label { fill: #cfcabf; }
      .sub { fill: #9a9488; }
      .axis { stroke: #565b63; }
      .blue { fill: #5b8ad0; }
      .pink { fill: #e0789c; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="560" rx="14"/>

  <text class="title" x="450" y="40" text-anchor="middle" font-size="21">활성화 함수는 어떻게 직선 경계를 휘게 하는가</text>

  <!-- ===== 상단: 늘리기 → 접기 반복이 직선을 곡선으로 ===== -->
  <text class="label" x="40" y="82" font-size="15" font-weight="600">① 늘리기 → 접기 를 반복하면, 직선이 점점 휘어진 경계에 가까워진다</text>

  <!-- frame 1: 직선 -->
  <g transform="translate(40,100)">
    <rect class="panel" x="0" y="0" width="170" height="120" rx="8"/>
    <line class="fold" x1="18" y1="95" x2="152" y2="30"/>
    <text class="sub" x="85" y="112" text-anchor="middle" font-size="12">직선 (활성화 없음)</text>
  </g>
  <path class="arrow" d="M222,160 h26" marker-end="url(#ah)"/>

  <!-- frame 2: 한 번 접기 -->
  <g transform="translate(258,100)">
    <rect class="panel" x="0" y="0" width="170" height="120" rx="8"/>
    <polyline class="fold" points="18,95 85,40 152,88"/>
    <text class="sub" x="85" y="112" text-anchor="middle" font-size="12">1번 접기 (ReLU ×1)</text>
  </g>
  <path class="arrow" d="M440,160 h26" marker-end="url(#ah)"/>

  <!-- frame 3: 여러 번 접기 -->
  <g transform="translate(476,100)">
    <rect class="panel" x="0" y="0" width="170" height="120" rx="8"/>
    <polyline class="fold" points="18,92 50,50 82,80 114,42 152,86"/>
    <text class="sub" x="85" y="112" text-anchor="middle" font-size="12">여러 번 접기 (ReLU 반복)</text>
  </g>
  <path class="arrow" d="M658,160 h26" marker-end="url(#ah)"/>

  <!-- frame 4: 곡선 -->
  <g transform="translate(694,100)">
    <rect class="panel" x="0" y="0" width="170" height="120" rx="8"/>
    <path class="ok" d="M18,92 C 55,20 115,20 152,86"/>
    <text class="sub" x="85" y="112" text-anchor="middle" font-size="12">임의의 곡선 경계</text>
  </g>

  <!-- ===== 하단: 데이터 위에서 본 결과 (선형 only vs ReLU) ===== -->
  <text class="label" x="40" y="272" font-size="15" font-weight="600">② 같은 데이터, 직선으로는 못 나누는 두 부류를 접기가 갈라낸다</text>

  <!-- 왼쪽: 선형만 -->
  <g transform="translate(120,296)">
    <rect class="panel" x="0" y="0" width="230" height="220" rx="8"/>
    <line class="axis" x1="24" y1="196" x2="206" y2="196"/>
    <line class="axis" x1="24" y1="24" x2="24" y2="196"/>
    <!-- pink blob (curved cluster) -->
    <circle class="pink" cx="78" cy="150" r="6"/>
    <circle class="pink" cx="96" cy="128" r="6"/>
    <circle class="pink" cx="118" cy="116" r="6"/>
    <circle class="pink" cx="140" cy="124" r="6"/>
    <circle class="pink" cx="152" cy="146" r="6"/>
    <circle class="pink" cx="132" cy="160" r="6"/>
    <circle class="pink" cx="108" cy="158" r="6"/>
    <circle class="pink" cx="90" cy="142" r="6"/>
    <!-- blue surrounding -->
    <circle class="blue" cx="50" cy="70" r="6"/>
    <circle class="blue" cx="86" cy="60" r="6"/>
    <circle class="blue" cx="130" cy="56" r="6"/>
    <circle class="blue" cx="170" cy="74" r="6"/>
    <circle class="blue" cx="188" cy="112" r="6"/>
    <circle class="blue" cx="182" cy="158" r="6"/>
    <circle class="blue" cx="156" cy="182" r="6"/>
    <circle class="blue" cx="110" cy="188" r="6"/>
    <circle class="blue" cx="66" cy="182" r="6"/>
    <circle class="blue" cx="44" cy="140" r="6"/>
    <circle class="blue" cx="40" cy="102" r="6"/>
    <!-- failing straight line -->
    <line class="fail" x1="30" y1="180" x2="206" y2="60"/>
    <text class="markfail" x="115" y="214" text-anchor="middle" font-size="13">✗ 직선 하나로는 못 가른다</text>
  </g>
  <text class="sub" x="235" y="296" text-anchor="middle" font-size="12">선형변환만 (직선)</text>

  <!-- 오른쪽: ReLU 접기 -->
  <g transform="translate(550,296)">
    <rect class="panel" x="0" y="0" width="230" height="220" rx="8"/>
    <line class="axis" x1="24" y1="196" x2="206" y2="196"/>
    <line class="axis" x1="24" y1="24" x2="24" y2="196"/>
    <circle class="pink" cx="78" cy="150" r="6"/>
    <circle class="pink" cx="96" cy="128" r="6"/>
    <circle class="pink" cx="118" cy="116" r="6"/>
    <circle class="pink" cx="140" cy="124" r="6"/>
    <circle class="pink" cx="152" cy="146" r="6"/>
    <circle class="pink" cx="132" cy="160" r="6"/>
    <circle class="pink" cx="108" cy="158" r="6"/>
    <circle class="pink" cx="90" cy="142" r="6"/>
    <circle class="blue" cx="50" cy="70" r="6"/>
    <circle class="blue" cx="86" cy="60" r="6"/>
    <circle class="blue" cx="130" cy="56" r="6"/>
    <circle class="blue" cx="170" cy="74" r="6"/>
    <circle class="blue" cx="188" cy="112" r="6"/>
    <circle class="blue" cx="182" cy="158" r="6"/>
    <circle class="blue" cx="156" cy="182" r="6"/>
    <circle class="blue" cx="110" cy="188" r="6"/>
    <circle class="blue" cx="66" cy="182" r="6"/>
    <circle class="blue" cx="44" cy="140" r="6"/>
    <circle class="blue" cx="40" cy="102" r="6"/>
    <!-- succeeding curved boundary wrapping pink -->
    <path class="ok" d="M60,150 C 58,108 96,92 128,100 C 160,108 172,140 152,164 C 130,188 88,186 68,170 C 60,162 60,156 60,150 Z"/>
    <text class="markok" x="115" y="214" text-anchor="middle" font-size="13">✓ 접힌 경계가 감싼다</text>
  </g>
  <text class="sub" x="665" y="296" text-anchor="middle" font-size="12">선형 + ReLU(접기) 반복</text>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a746a"/>
    </marker>
  </defs>
</svg>
