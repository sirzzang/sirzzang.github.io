<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470">
  <defs>
    <marker id="arrO2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#a06a3f"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif">

    <!-- ===== 패널 A: decode 스텝 1 ===== -->
    <text x="104" y="44" font-size="14" font-weight="bold" fill="#a06a3f">Decode 스텝 1 — forward 1회</text>

    <g font-size="12" fill="#666666" text-anchor="middle">
      <text x="126" y="76">나는</text>
      <text x="178" y="76">학교에</text>
      <text x="230" y="76">간다</text>
      <text x="282" y="76">t4</text>
    </g>
    <g font-size="12" fill="#333333" text-anchor="end">
      <text x="96" y="116">나는</text>
      <text x="96" y="168">학교에</text>
      <text x="96" y="220">간다</text>
      <text x="96" y="272">t4</text>
    </g>

    <!-- 이전 스텝까지 계산된 행 (회색 하삼각) -->
    <g fill="#d9d9d9">
      <rect x="104" y="88" width="44" height="44" rx="5"/>
      <rect x="104" y="140" width="44" height="44" rx="5"/>
      <rect x="156" y="140" width="44" height="44" rx="5"/>
      <rect x="104" y="192" width="44" height="44" rx="5"/>
      <rect x="156" y="192" width="44" height="44" rx="5"/>
      <rect x="208" y="192" width="44" height="44" rx="5"/>
    </g>
    <!-- 이번 스텝에 계산하는 행 (주황) -->
    <g fill="#c9895a">
      <rect x="104" y="244" width="44" height="44" rx="5"/>
      <rect x="156" y="244" width="44" height="44" rx="5"/>
      <rect x="208" y="244" width="44" height="44" rx="5"/>
      <rect x="260" y="244" width="44" height="44" rx="5"/>
    </g>
    <text x="316" y="270" font-size="13" fill="#a06a3f">→ t5 샘플링</text>

    <!-- 패널 사이 화살표 -->
    <line x1="352" y1="330" x2="482" y2="330" stroke="#a06a3f" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrO2)"/>
    <text x="356" y="318" font-size="13" fill="#a06a3f">t5를 새 행으로 추가</text>

    <!-- ===== 패널 B: decode 스텝 2 ===== -->
    <text x="520" y="44" font-size="14" font-weight="bold" fill="#a06a3f">Decode 스텝 2 — forward 1회</text>

    <g font-size="12" fill="#666666" text-anchor="middle">
      <text x="542" y="76">나는</text>
      <text x="594" y="76">학교에</text>
      <text x="646" y="76">간다</text>
      <text x="698" y="76">t4</text>
      <text x="750" y="76">t5</text>
    </g>
    <g font-size="12" fill="#333333" text-anchor="end">
      <text x="512" y="116">나는</text>
      <text x="512" y="168">학교에</text>
      <text x="512" y="220">간다</text>
      <text x="512" y="272">t4</text>
      <text x="512" y="324">t5</text>
    </g>

    <g fill="#d9d9d9">
      <rect x="520" y="88" width="44" height="44" rx="5"/>
      <rect x="520" y="140" width="44" height="44" rx="5"/>
      <rect x="572" y="140" width="44" height="44" rx="5"/>
      <rect x="520" y="192" width="44" height="44" rx="5"/>
      <rect x="572" y="192" width="44" height="44" rx="5"/>
      <rect x="624" y="192" width="44" height="44" rx="5"/>
      <rect x="520" y="244" width="44" height="44" rx="5"/>
      <rect x="572" y="244" width="44" height="44" rx="5"/>
      <rect x="624" y="244" width="44" height="44" rx="5"/>
      <rect x="676" y="244" width="44" height="44" rx="5"/>
    </g>
    <g fill="#c9895a">
      <rect x="520" y="296" width="44" height="44" rx="5"/>
      <rect x="572" y="296" width="44" height="44" rx="5"/>
      <rect x="624" y="296" width="44" height="44" rx="5"/>
      <rect x="676" y="296" width="44" height="44" rx="5"/>
      <rect x="728" y="296" width="44" height="44" rx="5"/>
    </g>
    <text x="784" y="322" font-size="13" fill="#a06a3f">→ 다음 토큰 …</text>

    <!-- 범례 -->
    <g font-size="13" fill="#555555">
      <rect x="104" y="420" width="16" height="16" rx="3" fill="#c9895a"/>
      <text x="128" y="433">이번 스텝에 계산하는 행 — 새 토큰의 어텐션</text>
      <rect x="480" y="420" width="16" height="16" rx="3" fill="#d9d9d9"/>
      <text x="504" y="433">이전 스텝까지 계산됨 — KV cache에서 읽기만</text>
    </g>
  </g>
</svg>
