coder:
  image:
    tag: v2.36.0
  env:
    - name: CODER_PG_CONNECTION_URL
      value: postgres://coder:coder@postgres.coder.svc.cluster.local:5432/coder?sslmode=disable
    - name: CODER_ACCESS_URL
      value: http://coder.coder.svc.cluster.local
    - name: CODER_TELEMETRY_ENABLE
      value: "false"
    - name: CODER_UPDATE_CHECK
      value: "false"
  service:
    type: ClusterIP
