<script>
  // #해시로 한 구역만 보일 때 사이드바에 현재 위치 표시
  (function () {
    var mark = function () {
      document.querySelectorAll(".topic__toc a").forEach(function (a) {
        if (a.hash ? a.hash === location.hash : !location.hash) a.setAttribute("aria-current", "location");
        else a.removeAttribute("aria-current");
      });
    };
    window.addEventListener("hashchange", mark);
    mark();
  })();
</script>
