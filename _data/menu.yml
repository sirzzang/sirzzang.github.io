# 메뉴 정의 (주제 → 하위 메뉴, 성격)
# 글의 front matter `categories`에는 아래 하위 메뉴 id(1개 이상)와 성격 id(정확히 1개)를 함께 적는다.
#   예: categories: [mlops-gpu, troubleshooting]
# 하위 메뉴 순서 = 화면 순서. 글이 0편인 하위 메뉴는 화면에 그려지지 않는다.
